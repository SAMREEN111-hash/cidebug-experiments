name: Test cidebug Action

on:
  workflow_dispatch:

jobs:
  test-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Do some work
        run: |
          echo "Working..."
          echo "important data" > output.txt

      - name: Fail intentionally
        run: |
          echo "Something went wrong!"
          exit 1

      - name: Debug with cidebug
        if: failure()
        shell: bash
        run: |
          echo "======================================"
          echo "  cidebug - Interactive CI Debugger"
          echo "======================================"
          curl -sf https://cidebug-production.up.railway.app/status
          curl -sL https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz -o /tmp/tmate.tar.xz
          cd /tmp && tar xf tmate.tar.xz && cp tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/tmate && cd -
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "SSH: $(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')"
          echo "Web: $(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')"
          sleep 1800
